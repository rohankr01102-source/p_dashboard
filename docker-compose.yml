version: "3.8"

# ============================================================
# IMPORTANT: copy .env.example to .env and fill in all secrets
# before running docker-compose up
# ============================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: vocalytics-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-vocalytics}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MongoDB root password is required}
      MONGO_INITDB_DATABASE: vocalytics
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - vocalytics-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vocalytics-ai-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENVIRONMENT: production
      ALLOWED_ORIGINS: http://localhost:3000,http://client:3000
    restart: unless-stopped
    networks:
      - vocalytics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vocalytics-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env.production
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USERNAME:-vocalytics}:${MONGO_PASSWORD}@mongodb:27017/vocalytics?authSource=admin
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - audio-uploads:/app/uploads
    networks:
      - vocalytics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vocalytics-frontend
    ports:
      - "3000:3000"
    environment:
      # In production Docker, API calls are proxied via Next.js rewrites to the server service
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://server:5000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vocalytics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 40s

networks:
  vocalytics-network:
    driver: bridge

volumes:
  mongo-data:
  audio-uploads:
